# Optional observability stack for Lab 25: Prometheus + Grafana + a GPU cost exporter.
# Usage:  docker compose up   (then Grafana at http://localhost:3000, admin/admin)
services:
  exporter:
    image: python:3.12-slim
    working_dir: /app
    command: python exporter.py
    environment:
      LAB_DATA_DIR: /data
      PORT: "9101"
      HOST: "0.0.0.0"
    volumes:
      - ./exporter.py:/app/exporter.py:ro
      - ../../data:/data:ro
    ports: ["127.0.0.1:9101:9101"]

  prometheus:
    image: prom/prometheus:latest
    user: "${LAB_UID:-1000}:${LAB_GID:-1000}"
    volumes:
      - ../../.bonus-state/prometheus:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["127.0.0.1:9090:9090"]
    depends_on: [exporter]

  grafana:
    image: grafana/grafana:11.6.0
    user: "${LAB_UID:-1000}:${LAB_GID:-1000}"
    tmpfs:
      - /tmp:size=64m
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ../../.bonus-state/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]
